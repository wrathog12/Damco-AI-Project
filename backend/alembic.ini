# Alembic configuration.
#
# Run from the `backend/` directory:
#   alembic revision --autogenerate -m "describe change"
#   alembic upgrade head
#   alembic downgrade -1
#   alembic current
#
# The database URL is NOT set here — migrations/env.py reads it from
# config.settings so there is exactly one source of truth for credentials.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Timestamped revision filenames sort chronologically and stop merge conflicts
# on a shared `versions/` directory.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
